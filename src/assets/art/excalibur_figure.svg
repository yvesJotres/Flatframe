<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 60 60" width="240" height="240">
  <!-- The Warframe figure, used by both the game and the Arsenal (visual_effects.js HUMANOID draws this file).
       Radius 16 units: the head is a circle above the centre and the body is a capsule. The equipped weapon is a separate layer. -->
  <g stroke-linecap="round">
    <!-- body: outline, then fill -->
    <line x1="0" y1="-3.2" x2="0" y2="8" stroke="#8a93a6" stroke-width="18"/>
    <line x1="0" y1="-3.2" x2="0" y2="8" stroke="#ffffff" stroke-width="16"/>
    <!-- head -->
    <circle cx="0" cy="-9.6" r="4.8" fill="#ffffff" stroke="#8a93a6" stroke-width="2"/>
  </g>
</svg>
