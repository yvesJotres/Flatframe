<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flatframe - World Builder</title>
  <link rel="stylesheet" href="src/assets/style.css" />
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a0c; font-family: system-ui, sans-serif; color: #fff; }
    #wb-container { display: flex; height: 100vh; width: 100vw; }
    #wb-toolbar { width: 280px; background: #111; border-right: 1px solid #222; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  <style>
    .wb-section { display: flex; flex-direction: column; gap: 6px; }
    .wb-section label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }
    .wb-btn { background: #1e1e22; border: 1px solid #333; color: #e0e0e0; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: border-color 0.15s, background 0.15s; display: flex; align-items: center; gap: 8px; }
    .wb-btn:hover { border-color: #555; background: #25252a; }
  </style>
  </style>
</head>
<body>
  <div id="wb-container">
    <div id="wb-toolbar">
      <div class="wb-section">
        <label>Tools</label>
        <button class="wb-btn active" id="tool-select" data-tool="select">🔍 Select / Move</button>
        <button class="wb-btn" id="tool-wall" data-tool="wall">🧱 Wall Panel (5m)</button>
        <button class="wb-btn" id="tool-spawn" data-tool="spawn">👤 Player Spawn</button>
      </div>
    </div>
    <div id="wb-canvas-area"><canvas id="wb-canvas"></canvas></div>
  </div>
  <script type="module" src="src/world_builder.js"></script>
</body>
</html>
