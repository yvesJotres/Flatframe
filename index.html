<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a14" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flatframe" />
  <title>Flatframe - 2D Shooter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="src/assets/style.css" />
  <!-- Loading screen styles are inline so it shows before anything else loads -->
  <style>
    #loading-screen {
      position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at 30% 20%, #0d0d1a 0%, #06060e 40%, #020205 100%);
      color: #f0e8e0; font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      transition: opacity 0.45s ease; user-select: none;
    }
    #loading-screen.done { opacity: 0; pointer-events: none; }
    #loading-screen .ls-title { font-size: clamp(36px, 9vh, 64px); font-weight: 700; letter-spacing: 2px; }
    @media (max-width: 600px) and (orientation: portrait) {
      #loading-screen .ls-title { display: flex; flex-direction: column; align-items: center; font-size: clamp(44px, 14vw, 64px); line-height: 1.05; }
    }
    #loading-screen .ls-sub { color: #ff6b35; font-size: 14px; letter-spacing: 4px; margin-top: -6px; }
    #loading-screen .ls-bar { width: min(360px, 70vw); height: 3px; margin-top: 28px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #loading-screen .ls-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffd78a); transition: width 0.3s ease; }
    #loading-screen .ls-status { color: #9090b0; font-size: 12px; letter-spacing: 1px; min-height: 16px; }
    #loading-screen .ls-error { color: #ff5b5b; font-size: 13px; max-width: 80vw; text-align: center; }
    #loading-screen .ls-corner { position: absolute; width: 60px; height: 60px; border-color: rgba(255,107,53,0.3); border-style: solid; border-width: 0; }
    #loading-screen .tl { top: 30px; left: 30px; border-top-width: 2px; border-left-width: 2px; }
    #loading-screen .tr { top: 30px; right: 30px; border-top-width: 2px; border-right-width: 2px; }
    #loading-screen .bl { bottom: 30px; left: 30px; border-bottom-width: 2px; border-left-width: 2px; }
    #loading-screen .br { bottom: 30px; right: 30px; border-bottom-width: 2px; border-right-width: 2px; }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite">
    <span class="ls-corner tl"></span><span class="ls-corner tr"></span>
    <span class="ls-corner bl"></span><span class="ls-corner br"></span>
    <div class="ls-title"><span class="ls-word">FLAT</span><span class="ls-word">FRAME</span></div>
    <div class="ls-sub">ORIGIN SYSTEM</div>
    <div class="ls-bar"><div class="ls-fill"></div></div>
    <div class="ls-status">Loading game files…</div>
    <button id="reload-btn" type="button" aria-label="Reload game" title="Reload" style="display:none;position:absolute;top:46px;left:96px;z-index:2;width:42px;height:42px;border-radius:6px;border:1px solid rgba(255,107,53,0.6);background:rgba(10,10,20,0.85);color:#ffd78a;font:700 20px system-ui,sans-serif;padding:0;cursor:pointer;">&#x21bb;</button>
  </div>
  <script>
    // Screen-size readout for diagnosing layout on touch devices. Open the page with ?debug to show it; tap it to hide.
    if (new URLSearchParams(location.search).has('debug') && window.matchMedia('(pointer: coarse)').matches) {
      var dbg = document.createElement('div');
      dbg.style.cssText = 'position:fixed;left:150px;top:46px;z-index:300;background:rgba(0,0,0,0.85);color:#9af0b0;font:12px monospace;padding:6px 8px;border:1px solid #9af0b0;border-radius:4px;white-space:pre;pointer-events:auto;';
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);';
      document.body.appendChild(probe);
      var show = function () {
        var cs = getComputedStyle(probe), vv = window.visualViewport, c = document.getElementById('gameCanvas'), cr = c ? c.getBoundingClientRect() : null;
        var gc = document.getElementById('game-container'), gr = gc ? gc.getBoundingClientRect() : null;
        dbg.textContent = [
          'screen ' + screen.width + 'x' + screen.height + ' dpr ' + devicePixelRatio,
          'inner ' + innerWidth + 'x' + innerHeight,
          'visual ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) : '-'),
          'safe T' + cs.paddingTop + ' B' + cs.paddingBottom + ' L' + cs.paddingLeft + ' R' + cs.paddingRight,
          'container ' + (gr ? Math.round(gr.width) + 'x' + Math.round(gr.height) + ' @' + Math.round(gr.top) : '-'),
          'canvas css ' + (cr ? Math.round(cr.width) + 'x' + Math.round(cr.height) : '-') + ' px ' + (c ? c.width + 'x' + c.height : '-'),
          'standalone ' + (navigator.standalone === true) + ' mode ' + (matchMedia('(display-mode: standalone)').matches ? 'standalone' : matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen' : 'browser'),
        ].join('\n');
      };
      dbg.addEventListener('click', function () { dbg.remove(); });
      document.body.appendChild(dbg);
      show();
      setInterval(show, 1000);
    }
    if (window.matchMedia('(pointer: coarse)').matches) {
      var reloadBtn = document.getElementById('reload-btn');
      reloadBtn.style.display = 'block';
      reloadBtn.addEventListener('click', function () { location.reload(); });
    }
    // Progress API for game.js; module downloads have no progress events, so creep toward 35% meanwhile
    (function () {
      var el = document.getElementById('loading-screen');
      var fill = el.querySelector('.ls-fill'), status = el.querySelector('.ls-status');
      var shown = performance.now(), progress = 0;
      function set(p, text) { progress = Math.max(progress, p); fill.style.width = (progress * 100) + '%'; if (text) status.textContent = text; }
      var creep = setInterval(function () { if (progress < 0.35) set(progress + 0.02); }, 120);
      window.loadingScreen = {
        set: set,
        done: function () {
          clearInterval(creep); set(1, 'Ready');
          // Stay up briefly so a fast load does not just flash
          setTimeout(function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 500); },
            Math.max(250, 700 - (performance.now() - shown)));
        },
        fail: function (msg) {
          clearInterval(creep); status.textContent = 'Failed to load';
          var e = document.createElement('div'); e.className = 'ls-error'; e.textContent = msg + ' — try reloading.'; el.appendChild(e);
        }
      };
      window.addEventListener('error', function (e) { if (document.getElementById('loading-screen') && !el.classList.contains('done')) window.loadingScreen.fail(e.message || 'Unknown error'); });
      window.addEventListener('unhandledrejection', function (e) { if (!el.classList.contains('done')) window.loadingScreen.fail(String(e.reason && e.reason.message || e.reason)); });
    })();
  </script>
  <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      <div id="damage-numbers-layer"></div>

    <div id="hud">
      <!-- Top-left: objective (mission) -->
      <div id="objective-region" class="hud-region top-left">
        <p id="mission-display">EXTERMINATE</p>
        <p id="objective-display">Eliminated 0 / 24</p>
      </div>

      <!-- Top-right: vitals (Warframe style) -->
      <div id="vitals-region" class="hud-region top-right">
        <div id="vital-values-row" class="vital-values-row">
          <span id="shield-display" class="vital-value shield">100</span>
          <span id="health-display" class="vital-value health">100</span>
        </div>
        <div id="vital-bars-row" class="vital-bars-row">
          <div id="shield-track" class="vital-track shield">
            <div id="shield-fill" class="vital-fill"></div>
          </div>
          <div id="health-track" class="vital-track health">
            <div id="health-fill" class="vital-fill"></div>
          </div>
        </div>
        <div id="frame-display" class="vital-frame">EXCALIBUR [30]</div>
        <div class="chips">
          <span id="armor-display" class="chip">ARMOR 240</span>
          <span id="energy-display" class="chip">ENERGY 150</span>
        </div>
      </div>

      <!-- Bottom-right: weapon and ammo -->
      <div id="ammo-panel" class="hud-region bottom-right">
              <div class="ammo-counts">
                <span id="ammo-display">45</span>
                <span id="reserve-display">/ 540</span>
              </div>
              <div id="melee-panel" class="hidden">
                <div class="melee-combo">
                  <span id="combo-mult">1.0x</span>
                  <span id="combo-hits">0 HITS</span>
                </div>
                <div class="melee-bar" title="Next combo tier"><div id="combo-tier-fill"></div></div>
                <div class="melee-bar decay" title="Combo timer"><div id="combo-decay-fill"></div></div>
                <div class="melee-states">
                  <span id="heavy-state" class="chip">HEAVY</span>
                  <span id="parry-state" class="chip">PARRY</span>
                </div>
              </div>
              <div id="weapon-display" class="ammo-weapon">BRATON [30]</div>
            </div>

      <!-- Bottom-left: dev read-out -->
      <div class="hud-region bottom-left">
        <p id="pos-display">POS 0, 0</p>
        <p id="angle-display">ANGLE 0°</p>
        <div class="scale-indicator">
          <span class="scale-line"></span>
          <span class="scale-label">1m</span>
        </div>
      </div>
    </div>

    <div id="damage-flash"></div>
    <div id="revive-panel" class="hidden">
      <div id="bleedout-timer">BLEEDING OUT 00:00</div>
      <div id="revive-count">4</div>
      <div id="revive-instruction">Hold X to Revive</div>
    </div>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
